<div class="container">
  <div class="card" style="max-width: 600px; margin: 50px auto;">
    <h2>Create Appointment</h2>
    
    <div *ngIf="success" style="color: green; margin-bottom: 15px;">
      Appointment created successfully! Redirecting...
    </div>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="service">Service *</label>
        <select 
          id="service" 
          [(ngModel)]="appointment.service" 
          name="service" 
          required>
          <option value="haircut">Haircut</option>
          <option value="beard">Beard</option>
          <option value="combo">Combo</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="date">Date *</label>
        <input 
          type="date" 
          id="date" 
          [(ngModel)]="appointment.appointment_date" 
          name="date" 
          (change)="onDateChange()"
          required>
      </div>
      
      <div class="form-group">
        <label for="time">Available Time Slots *</label>
        <div *ngIf="loadingSlots" style="color: #666;">Loading available slots...</div>
        <select 
          *ngIf="!loadingSlots && availableSlots.length > 0"
          id="time" 
          [(ngModel)]="appointment.appointment_time" 
          name="time" 
          required>
          <option value="">Select a time slot</option>
          <option *ngFor="let slot of availableSlots" [value]="slot">{{ slot }}</option>
        </select>
        <div *ngIf="!loadingSlots && availableSlots.length === 0 && appointment.appointment_date" style="color: #dc3545;">
          No available slots for this date
        </div>
      </div>
      
      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea 
          id="notes" 
          [(ngModel)]="appointment.notes" 
          name="notes" 
          rows="4"></textarea>
      </div>
      
      <div class="error" *ngIf="error">{{ error }}</div>
      
      <button type="submit" class="btn btn-primary">Create Appointment</button>
    </form>
  </div>
</div>
